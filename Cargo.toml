[package]
name = "oneshot"
authors = ["Luke M <44519853+lkdm@users.noreply.github.com>"]
description = "Oneshot makes executing one-off containerised scripts simple"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/lkdm/oneshot.git"
keywords = ["cli", "containers", "podman", "docker"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
nutype = "0.6.2"
serde = { version = "1.0.219", features = ["derive"] }
shell-words = "1.1.0"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
thiserror = "2"
toml = "0.9.5"
uuid = { version = "1.18.0", features = ["v4"] }
